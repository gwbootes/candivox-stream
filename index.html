<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Candivox Model Stage</title>
<style>
  /* OBS composites this page over the scene below it, so nothing here may
     paint an opaque background — not html, not body, not the canvas. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; background: transparent; }

  /* The editor pins the canvas to the stream's own 16:9 shape and centres it,
     so the bars either side are the parts of the window OBS will never see.
     Live sources are sized by OBS and never take this class. */
  body.boxed canvas {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    outline: 1px solid rgba(0, 255, 200, .25);
  }
  body.boxed { background: #0a0d10; }

  /* The pointer is hidden by default so a fullscreen browser window reads as
     a clean plate. Adding drag=1 puts it back, because posing a model by hand
     is impossible without seeing where you are grabbing. */
  html.hide-cursor, html.hide-cursor * { cursor: none; }

  /* Only ever visible while something is wrong. A silent black rectangle in
     OBS is indistinguishable from a broken source, so failures must speak. */
  #err {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    font: 14px/1.5 ui-monospace, Consolas, monospace;
    color: #ffd7d7; background: rgba(40, 0, 0, .82);
    padding: 2rem; text-align: center; white-space: pre-wrap;
  }

  /* The editor's readout. Only built when edit=1, so it can never appear on a
     live source by accident. */
  #hud {
    position: fixed; top: 12px; left: 12px; max-width: 340px;
    font: 12px/1.55 ui-monospace, Consolas, monospace;
    color: #d8f6ee; background: rgba(10, 18, 24, .84);
    border: 1px solid rgba(0, 255, 200, .35); border-radius: 6px;
    padding: 10px 12px; white-space: pre-wrap; pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
  #hud b   { color: #ff3ea5; font-weight: 600; }
  #hud i   { color: #7f8fa0; font-style: normal; }
  #hud .ok { color: #7dffb0; }
</style>
</head>
<body>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader }     from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader }     from 'three/addons/loaders/MTLLoader.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';

// ---------------------------------------------------------------------------
// One page serves every asset. Everything is driven off the query string.
//
//   ONE MODEL      index.html?model=models/television.obj
//   THE WHOLE SET  index.html?gallery=1
//   A CHOSEN FEW   index.html?models=models/tv.obj,models/gacha.obj
//
//   spin   auto-rotation in degrees per second (0 to hold still)
//   yaw    starting turn, degrees
//   pitch  camera height angle, degrees above the middle
//   zoom   distance multiplier; 1 frames things snugly
//   gap    space between models in a row, as a fraction of their width
//   even   1 rescales every model to the same height
//   drag   1 allows mouse orbit (needs OBS "Interact")
//   debug  1 paints a dark backdrop and a grid so you can see the stage
//
//   parallax  degrees the camera leans toward the pointer (0 disables)
//   follow    1 takes the steer from stage.py; the only way this works in OBS
//   sway      degrees of automatic lean, driven by a clock; needs no input
//   ease      how fast the lean catches up; lower is floatier
//
//   edit   1 opens the placement editor: click, drag, scale, save
// ---------------------------------------------------------------------------
const q     = new URLSearchParams(location.search);
const num   = (k, d) => { const v = parseFloat(q.get(k)); return Number.isFinite(v) ? v : d; };
const SPIN  = num('spin', 12);
const YAW   = num('yaw', 0);
const PITCH = num('pitch', 14);
const ZOOM  = num('zoom', 1);
const GAP   = num('gap', 0.25);
const EVEN  = q.get('even') === '1';
const DRAG  = q.get('drag') === '1';
const DEBUG = q.get('debug') === '1';
// follow=1 takes the lean from stage.py instead of from mouse events, which is
// the only way it can work inside OBS. Turning it on implies wanting a lean, so
// it brings a sensible parallax along with it.
const FOLLOW = q.get('follow') === '1';
const PARA  = num('parallax', FOLLOW ? 25 : 0);
const EASE  = num('ease', 4);
const FOV   = num('fov', 35);

const SWAY   = num('sway', 0);
const SWAYHZ = num('swayspeed', 0.09);

// Hand orbiting and pointer-lean both want the mouse, so drag wins outright.
const PARALLAX = PARA > 0 && !DRAG;
// An OBS Browser source never receives mouse movement, so sway drives the same
// camera lean off a clock instead. It only takes over when nothing else wants
// the camera.
const SWAYING  = SWAY > 0 && !DRAG && !PARALLAX;
// Whichever mode is live owns the swing, measured in degrees either way.
const SWING    = PARALLAX ? PARA : (SWAYING ? SWAY : 0);

// The placement editor. Everything it does happens on the desk surface, so it
// turns plate mode on for itself: placing a model against no reference at all
// would just be moving it around in the dark.
const EDIT = q.get('edit') === '1';

// ---------------------------------------------------------------------------
// PLATE CALIBRATION - bedroom-desk-v1.png, 1920x1080
//
// Solved from the plate itself rather than guessed. Both edges of the desk top
// were measured to sub-pixel precision across 47 columns and fitted:
//
//   far edge   y = 0.000625x + 822.558   (rms 0.085 px)
//   near edge  y = 0.005344x + 1031.808  (rms 0.070 px)
//
// They are straight, and they are NOT parallel, so they meet at a vanishing
// point. That puts the horizon at y = 794.84, which is BELOW the middle of the
// frame, meaning the plate's camera is tilted UP rather than down. Everything
// below follows from that plus the desk model being 10.0 units deep.
//
// The fov is an assumption. Change it and camY/nearZ change with it, but the
// projection stays identical, so the grid still lands on the same pixels.
// ---------------------------------------------------------------------------
const PLATE = {
  fov:      35,        // vertical, degrees
  pitch:    8.4635,    // degrees, positive tilts the camera UP
  camY:     0.1825,    // camera height above the desk top, obj units
  nearZ:    1.3743,    // ground distance from camera to the desk's front edge
  depth:    10.0,      // desk front-to-back, from the desk .obj bounding box
  width:    25.6,      // desk left-to-right, same source
  image:   'plates/bedroom-desk-v1.png',
};

const PLATEMODE = q.get('plate') === '1' || EDIT;
// The grid is what makes depth readable while dragging, so the editor brings it
// along unless it is turned off by hand with grid=0.
const GRID      = q.get('grid') === '1' || (EDIT && q.get('grid') !== '0');
const SHOWBG    = q.get('bg') === '1';
const CELL      = num('cell', 1);          // grid square size in obj units
const FLOOR     = num('floor', 120);       // how far the ground grid reaches

// Where the stream camera stands. These start at the calibrated numbers, or at
// whatever the URL asks for, and the editor's stream view moves them from there.
// Saving writes them into layout.json, so a viewpoint found by eye is the one
// the live page uses without a single query parameter to remember.
const camTf = {
  x:       num('camx', 0),          // sideways, 0 being the calibrated spot
  y:       num('camy', PLATE.camY),
  z:       num('camz', 0),          // positive backs away from the desk
  pitch:   num('horizon', 0),       // added to the calibrated pitch, degrees
  scouted: false,                   // true once it has been moved by hand
};

// Seeing the pointer is the whole job in both of these.
if (!DRAG && !EDIT) document.documentElement.classList.add('hide-cursor');

const fail = (msg) => {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'flex';
};

const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 100000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);   // the 0 alpha is what OBS keys on
document.body.appendChild(renderer.domElement);

// ---------------------------------------------------------------------------
// The canvas is shaped like the stream, not like the window.
//
// OBS renders this at 16:9. A browser window is almost never 16:9, and the
// camera's vertical angle is fixed, so a wider window quietly shows more to the
// left and right than the stream ever will. Every judgement about what sits
// near an edge is then made on a frame that does not exist. The editor pins the
// canvas to the real shape and greys out the rest of the window.
//
// ratio=0 turns it off. Live sources never get it at all, because OBS has
// already sized the source and a second opinion would only fight it.
// ---------------------------------------------------------------------------
const RATIO = q.get('ratio') === '0' ? 0 : num('ratio', 16 / 9);
const BOXED = EDIT && RATIO > 0;
if (BOXED) document.body.classList.add('boxed');

function resize() {
  let w = innerWidth, h = innerHeight;
  if (BOXED) {
    if (w / h > RATIO) w = Math.round(h * RATIO);
    else               h = Math.round(w / RATIO);
  }
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
resize();

// Pointer maths has to measure the canvas rather than the window, or every ray
// lands somewhere other than where the cursor is the moment the two differ.
const view2d = () => renderer.domElement.getBoundingClientRect();

if (DEBUG) {
  renderer.setClearColor(0x141018, 1);
  scene.add(new THREE.GridHelper(400, 40, 0x00ffc8, 0x334455));
}

// Voxel work reads best with flat, even light: one soft sky/ground wash so no
// face goes black, plus two directionals at opposing angles to keep the cube
// edges legible. Strong single-key lighting turns voxel art into mush.
scene.add(new THREE.HemisphereLight(0xffffff, 0x404058, 2.0));
const key  = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(1, 2, 1.5);
const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(-1.5, 0.6, -1);
scene.add(key, fill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enabled = DRAG;

// Sit the camera exactly where the plate's camera was. Ground plane y=0 is the
// desk top, and the desk runs from z=-nearZ at the front to z=-(nearZ+depth)
// at the back. Anything dropped on y=0 between those lands on the table.
function usePlateCamera() {
  if (!q.get('fov')) camera.fov = PLATE.fov;
  const pitch = THREE.MathUtils.degToRad(PLATE.pitch + camTf.pitch);

  if (q.get('flush') === '1' && !camTf.scouted) {
    // Raise the camera until the desk's front edge lands exactly on the bottom
    // of the frame, which hides the lip below it. Solved rather than nudged, so
    // it stays exact at any resolution: the bottom of frame is where the ray at
    // half the vertical fov meets the plane.
    //
    // The answer is handed to camTf rather than kept local, so nudging the
    // height by hand starts from the solved number instead of throwing it away.
    const T = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
    camTf.y = PLATE.nearZ * (T * Math.cos(pitch) - Math.sin(pitch))
                          / (Math.cos(pitch) + T * Math.sin(pitch));
  }

  camera.position.set(camTf.x, camTf.y, camTf.z);
  camera.rotation.set(pitch, 0, 0);
  camera.near = 0.01;
  camera.far  = 10000;
  camera.updateProjectionMatrix();
  controls.enabled = false;   // orbiting would throw away the match
}

// The working camera. Same shape as the stream camera on purpose: it stands on
// the floor facing front and tilts, and it never swings around the side or
// rolls over. A camera that can tumble is a camera you spend the whole session
// straightening out, and every shot judged through one is a shot the stream
// will never actually give you.
const view = { x: 0, y: 9, z: 26, pitch: -16 };   // pitch is degrees, up is +

// Push `view` onto the real camera. The one place the working camera moves.
function applyView() {
  camera.fov  = 35;
  camera.near = 0.01;
  camera.far  = 10000;
  camera.position.set(view.x, view.y, view.z);
  camera.rotation.set(THREE.MathUtils.degToRad(view.pitch), 0, 0);
  camera.updateProjectionMatrix();
  controls.enabled = false;
}

// Stand back far enough to see everything that is loaded, and aim at the middle
// of it. Measured from the scene rather than predicted, because saved
// placements can sit anywhere and any formula built on the staging grid goes
// wrong the moment one model has been moved.
function useEditorCamera() {
  const bounds = new THREE.Box3();
  for (const e of placed) bounds.expandByObject(e.pivot);
  bounds.expandByPoint(new THREE.Vector3(-PLATE.width / 2, 0, -PLATE.nearZ));
  bounds.expandByPoint(new THREE.Vector3(PLATE.width / 2, 0, -(PLATE.nearZ + PLATE.depth)));

  const c    = bounds.getCenter(new THREE.Vector3());
  const size = bounds.getSize(new THREE.Vector3());

  const halfV = THREE.MathUtils.degToRad(35) / 2;
  const halfH = Math.atan(Math.tan(halfV) * camera.aspect);
  // Depth counts toward the vertical span, because looking down at an angle
  // turns a deep scene into a tall one on screen.
  const dist  = Math.max(
    (size.x / 2) / Math.tan(halfH),
    (Math.max(size.z, size.y) / 2) / Math.tan(halfV)
  ) * 1.3;

  view.x = c.x;
  view.y = Math.max(1, c.y + dist * 0.42);
  view.z = bounds.max.z + dist * 0.9;
  view.pitch = -THREE.MathUtils.radToDeg(
    Math.atan2(view.y - c.y, view.z - c.z)
  );
  applyView();
}

// The ground at y=0, drawn out to the horizon in every direction, with the
// desk's own footprint marked on top of it.
//
// This used to stop at the edge of the desk. That made sense while the only
// question was whether the grid landed on the wood, and it was useless for
// every other question: a 25 by 10 patch floating in the middle of nothing
// tells you nothing about where to stand a camera or how far back the room
// goes. The floor runs past the desk now, and the desk is a rectangle on it.
function buildGrid() {
  const zFront = -PLATE.nearZ;
  const zBack  = -(PLATE.nearZ + PLATE.depth);
  const halfW  = PLATE.width / 2;
  const reach  = Math.max(FLOOR, PLATE.width, PLATE.depth * 2) / 2;
  const first  = -Math.ceil(reach / CELL) * CELL;   // snapped so lines meet at 0
  const pts    = [];

  for (let v = first; v <= reach + 1e-6; v += CELL) {
    pts.push(-reach, 0, v, reach, 0, v);   // left to right, stepping back
    pts.push(v, 0, -reach, v, 0, reach);   // front to back, the perspective ones
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.LineSegments(
    geo,
    new THREE.LineBasicMaterial({ color: 0x00ffc8, transparent: true, opacity: 0.28 })
  ));

  // The two axes through the origin, brighter, because the camera stands at
  // x=0 and losing track of the middle of the floor is easy out here.
  const axes = new THREE.BufferGeometry();
  axes.setAttribute('position', new THREE.Float32BufferAttribute([
    -reach, 0, 0,  reach, 0, 0,
    0, 0, -reach,  0, 0, reach,
  ], 3));
  scene.add(new THREE.LineSegments(
    axes,
    new THREE.LineBasicMaterial({ color: 0x00ffc8, transparent: true, opacity: 0.7 })
  ));

  // The desk, all four sides, so its edges stay obvious against a floor that
  // now runs straight past them.
  const edge = new THREE.BufferGeometry();
  edge.setAttribute('position', new THREE.Float32BufferAttribute([
    -halfW, 0, zFront,  halfW, 0, zFront,
     halfW, 0, zFront,  halfW, 0, zBack,
     halfW, 0, zBack,  -halfW, 0, zBack,
    -halfW, 0, zBack,  -halfW, 0, zFront,
  ], 3));
  scene.add(new THREE.LineSegments(
    edge, new THREE.LineBasicMaterial({ color: 0xff3ea5 })
  ));
}

// The plate itself, behind everything, for checking the grid lands on the wood.
// Drawn as a second scene so no camera move or fov change can shift it.
let bgScene = null, bgCam = null;
function showPlate() {
  bgCam   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  bgScene = new THREE.Scene();
  new THREE.TextureLoader().load(PLATE.image, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    bgScene.add(new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.MeshBasicMaterial({ map: tex, depthTest: false, depthWrite: false })
    ));
  });
}

const pivots = [];   // one per model; each spins about its own middle

// Where layout() parked the camera. Pointer-lean orbits around these instead
// of nudging the camera in place, so nearer models swing further across the
// frame than distant ones and the row gains real depth.
let baseDist = 0, basePitch = 0, framed = false;
let fitW = 0, fitH = 0;   // world-space extents the camera has to cover

// Pointer position as -1..1 from the middle of the window. `want` is where the
// camera is being asked to look; `have` chases it, which is what turns a jumpy
// cursor into a slow lean. Declared up here so placeCamera() can read them.
let wantX = 0, wantY = 0, haveX = 0, haveY = 0;
let swayT = 0;   // seconds elapsed, drives the automatic lean

// Breathing room around the framed set. Kept tight because every percent of
// padding is a percent the models shrink by.
const PAD = 1.08;

// MagicaVoxel writes its palette as a tiny image — often a single row of
// colour swatches. Three's default linear filtering blends neighbouring
// swatches, so every voxel comes out smeared with the wrong colour. Nearest
// sampling is mandatory here, not a stylistic choice.
function crispenTextures(root) {
  root.traverse((child) => {
    if (!child.isMesh) return;
    for (const mat of [].concat(child.material)) {
      if (!mat || !mat.map) continue;
      mat.map.magFilter  = THREE.NearestFilter;
      mat.map.minFilter  = THREE.NearestFilter;
      mat.map.generateMipmaps = false;
      mat.map.colorSpace = THREE.SRGBColorSpace;
      mat.map.needsUpdate = true;
    }
  });
}

// Filenames here contain spaces and capitals ("2-stereo rack.obj"), so every
// path segment has to be encoded or the fetch 404s while the folder looks fine.
const encodePath = (p) => p.split('/').map(encodeURIComponent).join('/');

function loadOne(path) {
  const ext  = path.split('.').pop().toLowerCase();
  const dir  = path.includes('/') ? path.slice(0, path.lastIndexOf('/') + 1) : '';
  const file = path.slice(dir.length);

  return new Promise((resolve, reject) => {
    if (ext === 'glb' || ext === 'gltf') {
      new GLTFLoader().load(encodePath(path), (g) => resolve(g.scene), undefined, reject);
      return;
    }
    if (ext !== 'obj') { reject(new Error(`Unsupported format ".${ext}"`)); return; }

    // MagicaVoxel emits three files together: model.obj, model.mtl and the
    // palette .png, all sharing a name. A missing .mtl is survivable — the
    // mesh loads grey — so fall back to a bare OBJ rather than failing.
    const objLoader = new OBJLoader();
    const bare = () => objLoader.setPath(encodePath(dir))
      .load(encodeURIComponent(file), resolve, undefined, reject);

    new MTLLoader()
      .setPath(encodePath(dir))
      .setResourcePath(encodePath(dir))
      .load(
        encodeURIComponent(file.replace(/\.obj$/i, '.mtl')),
        (materials) => {
          materials.preload();
          objLoader.setMaterials(materials).setPath(encodePath(dir))
            .load(encodeURIComponent(file), resolve, undefined, reject);
        },
        undefined,
        bare
      );
  });
}

// Models arrive at wildly different voxel scales and none of them sit on the
// origin, so every one gets measured and re-centred rather than hand-placed.
function prepare(object, path) {
  crispenTextures(object);
  const box    = new THREE.Box3().setFromObject(object);
  const size   = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  object.position.sub(centre);

  const pivot = new THREE.Group();
  pivot.add(object);
  pivot.rotation.y = THREE.MathUtils.degToRad(YAW);
  // Every mesh under here answers back to its entry, so a raycast hit anywhere
  // on a model resolves to the thing the editor should select.
  pivot.traverse(n => { n.userData.path = path; });
  return { path, pivot, size, tf: null };
}

// ---------------------------------------------------------------------------
// PLACEMENT
//
// A placed model is described by five numbers in layout.json, keyed by path:
//
//   x, z    where it stands on the desk, in obj units, 0,0 under the camera
//   ry      how far it is turned, degrees
//   s       scale multiplier, 1 being the size MagicaVoxel exported
//   lift    height above the desk top; 0 rests on the wood
//
// Height is derived rather than stored. A model always sits on the surface, so
// scaling it up cannot sink it through the table.
// ---------------------------------------------------------------------------
const placed = [];        // every loaded entry, in load order
let   layoutData = {};    // path -> transform, as read from and written to disk
let   stagingReach = 0;   // how far the unplaced pile extends, for framing it

const defaultTf = () => ({ x: 0, z: -(PLATE.nearZ + PLATE.depth / 2), ry: YAW, s: 1, lift: 0 });

// Push an entry's numbers onto its pivot. The single place any model moves.
function applyTf(e) {
  if (!e.tf) return;
  const t = e.tf;
  // even=1 already rescaled this model before the editor ever saw it, and that
  // factor is baked into e.size. Multiplying rather than replacing keeps the
  // stored scale meaning "how much bigger than normal", so a saved layout does
  // not shift the moment even= is turned on or off.
  e.pivot.scale.setScalar(t.s * (e.baseScale || 1));
  e.pivot.rotation.y = THREE.MathUtils.degToRad(t.ry);
  e.pivot.position.set(t.x, (e.size.y * t.s) / 2 + t.lift, t.z);
  // Hiding is for the live page. Inside the editor a hidden model stays on
  // screen, or there would be no way to click it and bring it back.
  e.pivot.visible = EDIT || !t.hidden;
}

// Lay the set out in a single row along X. Each model keeps its own pivot so
// it turns about its own middle instead of orbiting the row's centre.
function layout(entries) {
  if (!entries.length) { fail('Nothing loaded.'); return; }

  if (EVEN) {
    const tallest = Math.max(...entries.map(e => e.size.y));
    for (const e of entries) {
      const s = tallest / (e.size.y || 1);
      e.pivot.scale.setScalar(s);
      e.size = e.size.clone().multiplyScalar(s);
      // Remembered so the editor can keep its own scale separate from this one.
      e.baseScale = s;
    }
  }

  // A rotating model sweeps a circle, so reserve its diagonal footprint or
  // neighbours clip through each other as they turn.
  const widths = entries.map(e => Math.hypot(e.size.x, e.size.z));
  const total  = widths.reduce((a, w) => a + w, 0) + GAP * widths[0] * (entries.length - 1);

  let x = -total / 2;
  for (let i = 0; i < entries.length; i++) {
    x += widths[i] / 2;
    entries[i].pivot.position.x = x;
    x += widths[i] / 2 + GAP * widths[0];
    scene.add(entries[i].pivot);
    placed.push(entries[i]);
  }

  // Plate mode has a camera it must not move, so the models come to the camera
  // instead. Anything with a saved place takes it. Anything without goes to the
  // staging area behind the desk.
  //
  // The single row above is wrong here. These models are large and there are
  // fifteen of them, so a row runs about 250 units wide against a desk that is
  // 25.6 across, which parks most of them off screen in both directions. A
  // squarish grid keeps the whole set reachable instead.
  if (PLATEMODE) {
    const waiting = entries.filter(e => !layoutData[e.path]);
    const cols    = Math.max(1, Math.ceil(Math.sqrt(waiting.length)));
    const cell    = Math.max(...entries.map(e => Math.hypot(e.size.x, e.size.z))) * 1.15;
    const zBack   = -(PLATE.nearZ + PLATE.depth);
    let   n       = 0;

    for (const e of entries) {
      const saved = layoutData[e.path];
      if (saved) {
        e.tf = { ...defaultTf(), ...saved };
        applyTf(e);
        continue;
      }
      const col = n % cols, row = Math.floor(n / cols);
      n++;
      e.pivot.position.set(
        (col - (cols - 1) / 2) * cell,
        e.size.y / 2,
        zBack - cell * (row + 1)
      );
      // Unplaced models keep turning. It reads as "not dealt with yet"
      // against the stillness of everything already set down.
      pivots.push(e.pivot);
    }

    stagingReach = cols * cell;
    return;
  }

  for (const e of entries) pivots.push(e.pivot);

  fitW      = total || 1;
  fitH      = Math.max(...entries.map(e => e.size.y)) || 1;
  basePitch = THREE.MathUtils.degToRad(PITCH);
  framed    = true;
  refit();

  controls.target.set(0, 0, 0);
  controls.update();
}

// Three's `fov` is the VERTICAL angle. A row of models is a horizontal span, so
// measuring it against the vertical angle pulls the camera back by roughly the
// aspect ratio further than needed and the models come out tiny on a widescreen
// canvas. Width is checked against the horizontal angle, height against the
// vertical one, and whichever needs more room decides the distance.
function refit() {
  if (!framed) return;
  const halfV = THREE.MathUtils.degToRad(camera.fov) / 2;
  const halfH = Math.atan(Math.tan(halfV) * camera.aspect);

  baseDist = Math.max(
    (fitW / 2) / Math.tan(halfH),
    (fitH / 2) / Math.tan(halfV)
  ) * PAD * ZOOM;

  camera.near = Math.max(baseDist / 1000, 0.01);
  camera.far  = baseDist * 100;
  camera.updateProjectionMatrix();
  placeCamera();
}

// Position the camera on its orbit, offset by however far the pointer-lean has
// currently travelled. Called on every frame that parallax is running, and once
// per reframe so a resize lands the camera in the right place immediately.
function placeCamera() {
  const swing = THREE.MathUtils.degToRad(SWING);
  const yaw   = haveX * swing;
  // Vertical travel is damped and clamped: swinging the camera under the floor
  // or straight overhead looks broken rather than responsive.
  const pitch = THREE.MathUtils.clamp(
    basePitch - haveY * swing * 0.6,
    THREE.MathUtils.degToRad(-25),
    THREE.MathUtils.degToRad(75)
  );

  camera.position.set(
    Math.sin(yaw) * Math.cos(pitch) * baseDist,
    Math.sin(pitch) * baseDist,
    Math.cos(yaw) * Math.cos(pitch) * baseDist
  );
  camera.lookAt(0, 0, 0);
}

// ---------------------------------------------------------------------------
// THE EDITOR
//
// Click a model to pick it up, drag it around the desk, scroll to resize, turn
// it with Q and E, then press S to write layout.json. Nothing here loads unless
// edit=1, so a live OBS source carries none of it.
// ---------------------------------------------------------------------------
function startEditor() {
  const ray    = new THREE.Raycaster();
  const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hit    = new THREE.Vector3();
  const hud    = document.createElement('div');
  hud.id = 'hud';
  document.body.appendChild(hud);

  let sel = null, box = null, dragging = false, dragDX = 0, dragDZ = 0, note = '';
  let streamView = false;   // false means the free working camera
  let panning = false;
  const panLast = new THREE.Vector2();

  useEditorCamera();

  // Whichever camera the keys and the mouse are currently driving. Both are the
  // same shape, so everything below works on either without knowing which.
  const active = () => (streamView ? camTf : view);

  // Put the numbers back on the real camera after anything changes them.
  function refresh() {
    if (streamView) { camTf.scouted = true; usePlateCamera(); }
    else applyView();
    draw();
  }

  // How many world units one pixel covers, near whatever is being looked at.
  // Panning by a fixed amount per pixel feels wrong at every distance except
  // the one it was tuned for.
  function unitsPerPixel() {
    const cam = active();
    const reach = Math.max(2, Math.hypot(cam.y, cam.z + PLATE.nearZ + PLATE.depth / 2));
    return 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * reach / view2d().height;
  }

  // Where the pointer meets the desk surface, in world units. Returns false
  // when the ray goes above the horizon and never touches the plane.
  // Screen pixels to the -1..1 the raycaster wants, measured off the canvas so
  // it stays right when the canvas is smaller than the window.
  const ndc = (ev) => {
    const r = view2d();
    return new THREE.Vector2(
      ((ev.clientX - r.left) / r.width) * 2 - 1,
      -((ev.clientY - r.top) / r.height) * 2 + 1
    );
  };

  const onDesk = (ev) => {
    ray.setFromCamera(ndc(ev), camera);
    return ray.ray.intersectPlane(ground, hit) !== null;
  };

  const pick = (ev) => {
    ray.setFromCamera(ndc(ev), camera);
    for (const h of ray.intersectObjects(placed.map(e => e.pivot), true)) {
      const e = placed.find(p => p.path === h.object.userData.path);
      if (e) return e;
    }
    return null;
  };

  // Picking a model up settles it. It stops spinning and gains real numbers,
  // taken from wherever it happened to be sitting at that moment.
  function select(e) {
    if (box) { scene.remove(box); box.geometry.dispose(); box = null; }
    sel = e;
    if (!sel) { draw(); return; }

    if (!sel.tf) {
      sel.tf = {
        x: sel.pivot.position.x,
        z: sel.pivot.position.z,
        ry: (THREE.MathUtils.radToDeg(sel.pivot.rotation.y) % 360 + 360) % 360,
        // Divided back out for the same reason applyTf multiplies it in: the
        // saved number means "bigger than normal", never "bigger than even=1".
        s: sel.pivot.scale.x / (sel.baseScale || 1),
        lift: 0,
        hidden: false,
      };
      const i = pivots.indexOf(sel.pivot);
      if (i >= 0) pivots.splice(i, 1);
      applyTf(sel);
    }

    box = new THREE.BoxHelper(sel.pivot, 0xff3ea5);
    scene.add(box);
    draw();
  }

  const commit = () => { applyTf(sel); if (box) box.setFromObject(sel.pivot); draw(); };
  const step   = (ev, base) => base * (ev.shiftKey ? 10 : ev.altKey ? 0.1 : 1);

  // Capture phase on the window, which runs before OrbitControls' own listener
  // on the canvas. Disabling the controls from a listener that fires after
  // theirs is too late: they have already begun a rotate, and the first frames
  // of every attempt to move a model went into swinging the camera instead.
  addEventListener('pointerdown', (ev) => {
    if (ev.target !== renderer.domElement) return;
    if (ev.button !== 0) return;
    const e = pick(ev);
    select(e);
    if (e && onDesk(ev)) {
      // Grab it where it was clicked, not by its middle, so it does not jump
      // out from under the cursor the instant it is touched.
      dragging = true;
      dragDX = e.tf.x - hit.x;
      dragDZ = e.tf.z - hit.z;
    } else {
      // Empty space, so the drag moves you instead of a model. Grabbing the
      // world is the gesture everyone already has for this, and it saves
      // hunting for a key every time the shot needs to shift a little.
      panning = true;
      panLast.set(ev.clientX, ev.clientY);
    }
    renderer.domElement.setPointerCapture(ev.pointerId);
  }, true);

  renderer.domElement.addEventListener('pointermove', (ev) => {
    if (panning) {
      const cam = active(), u = unitsPerPixel();
      cam.x -= (ev.clientX - panLast.x) * u;
      cam.y  = Math.max(0, cam.y + (ev.clientY - panLast.y) * u);
      panLast.set(ev.clientX, ev.clientY);
      refresh();
      return;
    }
    if (!dragging || !sel || !onDesk(ev)) return;
    sel.tf.x = hit.x + dragDX;
    sel.tf.z = hit.z + dragDZ;
    if (ev.shiftKey) {
      sel.tf.x = Math.round(sel.tf.x / CELL) * CELL;
      sel.tf.z = Math.round(sel.tf.z / CELL) * CELL;
    }
    commit();
  });

  const stop = () => { dragging = false; panning = false; };
  renderer.domElement.addEventListener('pointerup', stop);
  renderer.domElement.addEventListener('pointercancel', stop);

  // The wheel walks the camera along the way it is pointing, so zooming in on
  // the desk also comes down toward it instead of sliding back at a fixed
  // height and ending up staring at the ceiling.
  renderer.domElement.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const cam  = active();
    const p    = THREE.MathUtils.degToRad(
      (streamView ? PLATE.pitch : 0) + cam.pitch
    );
    const back = Math.sign(ev.deltaY) * (ev.shiftKey ? 8 : ev.altKey ? 0.2 : 1.5);
    cam.z += back * Math.cos(p);
    cam.y  = Math.max(0, cam.y - back * Math.sin(p));
    refresh();
  }, { passive: false });

  addEventListener('keydown', (ev) => {
    const k = ev.key;

    if (k === 'Tab') {
      ev.preventDefault();
      const i = sel ? placed.indexOf(sel) : -1;
      select(placed[(i + 1) % placed.length]);
      return;
    }
    if (k === 'Escape') { select(null); return; }
    if (k === 's' || k === 'S') { ev.preventDefault(); save(); return; }

    // Check the real shot without leaving the editor. This is the camera OBS
    // will use, framing and all, so it is the only honest preview.
    if (k === 'c' || k === 'C') {
      streamView = !streamView;
      if (streamView) usePlateCamera(); else useEditorCamera();
      note = '';
      draw();
      return;
    }

    // Fly to whatever is selected. Indispensable once a model is small and
    // buried behind three others.
    if ((k === 'z' || k === 'Z') && sel && !streamView) {
      const reach = Math.max(sel.size.x, sel.size.y, sel.size.z) * sel.tf.s * 2.4;
      const ty = (sel.size.y * sel.tf.s) / 2 + sel.tf.lift;
      view.x = sel.tf.x;
      view.y = Math.max(0.4, ty + reach * 0.4);
      view.z = sel.tf.z + reach;
      view.pitch = -THREE.MathUtils.radToDeg(
        Math.atan2(view.y - ty, view.z - sel.tf.z)
      );
      refresh();
      return;
    }

    // With nothing selected the keys drive the camera, and selecting a model
    // hands the same keys to the model. That is the whole scheme: no mode to
    // remember, and walking to the next thing never means leaving the view you
    // were judging the shot in. Esc puts a model down and gives them back.
    if (!sel) {
      const cam = active();
      const g   = streamView ? 0.25 : 1;   // the stream shot wants finer steps
      switch (k) {
        case 'ArrowLeft':   cam.x -= step(ev, g); break;
        case 'ArrowRight':  cam.x += step(ev, g); break;
        case 'ArrowUp':     cam.z -= step(ev, g); break;   // toward the desk
        case 'ArrowDown':   cam.z += step(ev, g); break;   // back away
        case 'PageUp':      cam.y += step(ev, g * 0.5); break;
        case 'PageDown':    cam.y  = Math.max(0, cam.y - step(ev, g * 0.5)); break;
        case 'q': case 'Q': cam.pitch -= step(ev, g * 2); break;
        case 'e': case 'E': cam.pitch += step(ev, g * 2); break;
        case 'f': case 'F': cam.pitch = streamView ? -PLATE.pitch : 0; break;
        case 'r': case 'R':
          if (streamView) { camTf.x = 0; camTf.y = PLATE.camY; camTf.z = 0; camTf.pitch = 0; }
          else useEditorCamera();
          break;
        default: return;
      }
      ev.preventDefault();
      refresh();
      return;
    }

    const t = sel.tf;
    switch (k) {
      case 'ArrowLeft':  t.x -= step(ev, 0.1); break;
      case 'ArrowRight': t.x += step(ev, 0.1); break;
      case 'ArrowUp':    t.z -= step(ev, 0.1); break;
      case 'ArrowDown':  t.z += step(ev, 0.1); break;
      case 'q': case 'Q': t.ry = (t.ry - step(ev, 5) + 360) % 360; break;
      case 'e': case 'E': t.ry = (t.ry + step(ev, 5)) % 360; break;
      case '[': t.s = Math.max(0.02, t.s * (1 - step(ev, 0.02))); break;
      case ']': t.s = Math.min(50,   t.s * (1 + step(ev, 0.02))); break;
      case 'PageUp':   t.lift += step(ev, 0.05); break;
      case 'PageDown': t.lift -= step(ev, 0.05); break;
      case 'f': case 'F': t.lift = 0; break;
      case 'v': case 'V': t.hidden = !t.hidden; break;
      case 'r': case 'R': sel.tf = { ...defaultTf(), hidden: false }; break;
      default: return;
    }
    ev.preventDefault();
    commit();
  });

  async function save() {
    const models = {};
    for (const e of placed) {
      if (!e.tf) continue;
      models[e.path] = {
        x:    +e.tf.x.toFixed(4),
        z:    +e.tf.z.toFixed(4),
        ry:   +e.tf.ry.toFixed(2),
        s:    +e.tf.s.toFixed(4),
        lift: +e.tf.lift.toFixed(4),
        hidden: !!e.tf.hidden,
      };
    }
    // The camera rides along with the models. Where it stands is as much a part
    // of the shot as what is on the desk, and keeping it in the same file means
    // there is one thing to reload rather than a query string to retype.
    const cam = {
      x:     +camTf.x.toFixed(4),
      y:     +camTf.y.toFixed(4),
      z:     +camTf.z.toFixed(4),
      pitch: +camTf.pitch.toFixed(3),
    };
    const body = JSON.stringify({ models, camera: cam }, null, 2);

    try {
      const res = await fetch('layout.json', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      note = `saved layout.json  (${Object.keys(models).length} placed, camera at ${cam.y.toFixed(2)})`;
    } catch (err) {
      // Served by anything other than stage.py, so there is nothing listening
      // to write the file. Hand the text over instead of losing the work.
      try { await navigator.clipboard.writeText(body); } catch (e2) { /* no permission */ }
      console.log(body);
      note = 'no server to save to. JSON copied to clipboard and logged to the console.';
    }
    draw();
  }

  function draw() {
    const n = placed.filter(e => e.tf).length;

    if (!sel) {
      // Nothing held, so the keys are driving the camera and the panel says so.
      // The numbers matter as much as the picture when the camera is the stream
      // camera, since S writes them into layout.json and the live page uses them.
      const cam = active();
      hud.innerHTML =
        (streamView
          ? `<b>STREAM CAMERA</b>  <i>the real shot</i>\n`
          : `<b>CANDIVOX PLACEMENT</b>  ${n}/${placed.length} placed\n`) +
        `height ${cam.y.toFixed(2)}   across ${cam.x.toFixed(2)}   ` +
        `back ${cam.z.toFixed(2)}   tilt ${((streamView ? PLATE.pitch : 0) + cam.pitch).toFixed(1)}°\n` +
        `<i>frame ${view2d().width.toFixed(0)}x${view2d().height.toFixed(0)}` +
        `${BOXED ? '  locked to the stream shape' : '  window shape, not the stream'}` +
        `${BOXED && view2d().width < 1920 ? '. F11 for the full 1920' : ''}</i>\n\n` +
        `<i>click a model to pick it up, or Tab through them\n` +
        `drag empty space   move yourself around\n` +
        `wheel              walk in and out\n` +
        `arrows             sideways and forward\n` +
        `PgUp/PgDn          up and down\n` +
        `Q  E               tilt down / up\n` +
        `F                  look level\n` +
        `R                  ${streamView ? 'back to the calibrated shot' : 'see everything again'}\n` +
        `C                  ${streamView ? 'back to the work camera' : 'jump to the real stream shot'}\n` +
        `S                  save</i>` +
        (note ? `\n\n<span class="ok">${note}</span>` : '');
      return;
    }
    const t = sel.tf;
    hud.innerHTML =
      `<b>${sel.path.replace(/^models\//, '')}</b>${t.hidden ? '  <i>(hidden)</i>' : ''}\n` +
      `x ${t.x.toFixed(2)}   z ${t.z.toFixed(2)}   turn ${t.ry.toFixed(0)}°\n` +
      `scale ${t.s.toFixed(3)}   lift ${t.lift.toFixed(2)}\n\n` +
      `<i>drag it   move on the desk (Shift snaps)\n` +
      `[  ]      smaller / bigger\n` +
      `Q  E      turn        arrows  nudge\n` +
      `PgUp/Dn   lift        F       back down to the desk\n` +
      `V         hide from the live page\n` +
      `R         start this one over    Tab  next\n` +
      `Z         fly to it   C   real stream shot\n` +
      `S         save layout.json</i>` +
      (note ? `\n\n<span class="ok">${note}</span>` : '');
  }

  draw();
  // Going fullscreen changes the frame, and the panel is reporting its size.
  onResize = draw;

  // diag=1 fires a synthetic pick at a spread of screen points and reports what
  // came back. Headless Chrome cannot click, so this is the only way to prove
  // selection works without a human at the mouse.
  if (q.get('diag') === '1') {
    const lines = [`placed=${placed.length}  pivots=${pivots.length}  stagingReach=${stagingReach.toFixed(1)}`];
    lines.push(`camera ${camera.position.toArray().map(v => v.toFixed(1)).join(',')}  pitch ${view.pitch.toFixed(1)}`);

    for (const e of placed) {
      let meshes = 0;
      e.pivot.traverse(n => { if (n.isMesh) meshes++; });
      const p = e.pivot.position;
      lines.push(
        `  ${e.path.slice(-26)}  pos ${p.x.toFixed(1)},${p.y.toFixed(1)},${p.z.toFixed(1)}` +
        `  meshes=${meshes}  vis=${e.pivot.visible}  tf=${e.tf ? 'yes' : 'no'}`
      );
    }

    // Aim straight at the first model and see whether a ray fired at it lands.
    if (placed.length) {
      const t = placed[0].pivot.position.clone();
      const dir = t.clone().sub(camera.position).normalize();
      ray.set(camera.position, dir);
      const direct = ray.intersectObjects(placed.map(p => p.pivot), true);
      lines.push(`direct ray at model 0: hits=${direct.length}`);
    }
    // Aim at a model by projecting it to screen coordinates, rather than
    // guessing at fractions of the window and landing between rows.
    // The camera was moved a moment ago and nothing has rendered yet, so its
    // world matrix is still the old one. Projecting against it gives screen
    // coordinates for where the camera used to be.
    camera.updateMatrixWorld(true);

    const target = placed[1];
    const world  = target.pivot.position.clone();
    const proj   = world.clone().project(camera);
    const r  = view2d();
    const sx = r.left + (proj.x + 1) / 2 * r.width;
    const sy = r.top + (-proj.y + 1) / 2 * r.height;
    const onScreen = sx >= r.left && sx <= r.right && sy >= r.top && sy <= r.bottom;
    lines.push(`\nwindow ${innerWidth}x${innerHeight}  canvas ${r.width.toFixed(0)}x${r.height.toFixed(0)}  aspect ${camera.aspect.toFixed(2)}`);
    lines.push(`target ${target.path.slice(-22)} projects to ${sx.toFixed(0)},${sy.toFixed(0)}  ${onScreen ? 'ON SCREEN' : 'OFF SCREEN'}`);

    // How many of the whole set land inside the window is the number that
    // actually decides whether this thing is usable.
    let visible = 0;
    for (const e of placed) {
      const p = e.pivot.position.clone().project(camera);
      if (p.x >= -1 && p.x <= 1 && p.y >= -1 && p.y <= 1 && p.z < 1) visible++;
    }
    lines.push(`${visible}/${placed.length} models inside the window`);
    lines.push(`pick there = ${pick({ clientX: sx, clientY: sy })?.path?.slice(-22) || 'NULL'}`);

    lines.push(`ground plane reachable: ${onDesk({ clientX: sx, clientY: sy })}`);
    const el = document.getElementById('err');
    el.textContent = 'DIAG\n' + lines.join('\n');
    el.style.display = 'flex';
  }
}

async function boot() {
  let paths = [];

  if (PLATEMODE) {
    // The layout is read before the camera is placed, because the layout is
    // where the camera's own position lives now.
    //
    // A missing file is the normal state the first time, so it must not read as
    // an error. It just means nothing has been put down yet.
    try {
      const res = await fetch('layout.json', { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        layoutData = data.models || {};
        // A number in the URL beats the saved one, so a one-off experiment
        // never has to overwrite the shot that is already working.
        const cam = data.camera;
        if (cam) {
          if (!q.get('camx')    && Number.isFinite(cam.x))     camTf.x = cam.x;
          if (!q.get('camy')    && Number.isFinite(cam.y))     camTf.y = cam.y;
          if (!q.get('camz')    && Number.isFinite(cam.z))     camTf.z = cam.z;
          if (!q.get('horizon') && Number.isFinite(cam.pitch)) camTf.pitch = cam.pitch;
          camTf.scouted = true;
        }
      }
    } catch (e) {
      // No layout yet, or served from somewhere that has none. Start empty.
    }

    usePlateCamera();
    if (SHOWBG) showPlate();
    if (GRID)   buildGrid();
  }

  // The editor needs the whole set on hand, since its entire job is deciding
  // what goes where. Asking for it without naming any models means all of them.
  const wantAll = q.get('gallery') === '1'
    || (EDIT && !q.get('models') && !q.get('model'));

  if (wantAll) {
    // A browser cannot list a folder, so the set is declared in manifest.json.
    // Re-run make-manifest.bat after exporting new models.
    try {
      // no-store matters more than it looks. This file changes every time a
      // model is added or excluded, and a cached copy silently shows the old
      // lineup while the folder on disk says otherwise.
      const res  = await fetch('models/manifest.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      paths = data.models.map(n => 'models/' + n);
    } catch (e) {
      fail(`Could not read models/manifest.json\n${e.message}\n\nRun make-manifest.bat, then reload.`);
      return;
    }
  } else if (q.get('models')) {
    paths = q.get('models').split(',').map(s => s.trim()).filter(Boolean);
  } else if (q.get('model')) {
    paths = [q.get('model')];
  } else if (PLATEMODE) {
    // Checking the grid against the plate is a legitimate reason to load
    // nothing at all, so this is not an error.
    return;
  } else {
    fail('No model given.\n\nOne model:  ?model=models/yourfile.obj\nAll of them: ?gallery=1');
    return;
  }

  const results = await Promise.allSettled(paths.map(loadOne));
  const good = [], bad = [];
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') good.push(prepare(r.value, paths[i]));
    else bad.push(`${paths[i]} — ${r.reason?.message || r.reason}`);
  });

  if (!good.length) { fail(`Nothing loaded.\n\n${bad.join('\n')}`); return; }
  layout(good);
  if (EDIT) startEditor();
  if (bad.length) console.warn('[candivox] models that failed to load:\n' + bad.join('\n'));
}

if (PARALLAX && FOLLOW) {
  // Asking beats waiting. OBS never delivers a mouse event to this page, so
  // the steer gets pulled from stage.py on a timer instead. Whatever stage.py
  // reports drives the lean, which is how Silhouette will steer it later
  // without this file changing at all.
  const POLL = q.get('followurl') || '/position';
  const tick = async () => {
    try {
      const res = await fetch(POLL, { cache: 'no-store' });
      if (res.ok) {
        const d = await res.json();
        if (Number.isFinite(d.x)) wantX = d.x;
        if (Number.isFinite(d.y)) wantY = d.y;
      }
    } catch (e) {
      // Bridge is down or restarting. Hold the last steer and keep asking;
      // snapping to centre on every hiccup would read as a glitch on stream.
    }
    setTimeout(tick, 33);
  };
  tick();
} else if (PARALLAX) {
  addEventListener('pointermove', (e) => {
    wantX = (e.clientX / innerWidth)  * 2 - 1;
    wantY = (e.clientY / innerHeight) * 2 - 1;
  });
  // Drift back to centre when the pointer leaves, so the scene never parks
  // at a hard angle just because the mouse went to another monitor.
  addEventListener('pointerleave', () => { wantX = 0; wantY = 0; });
}

let onResize = () => {};
addEventListener('resize', () => {
  // The framing depends on aspect now, so a resize has to re-measure rather
  // than just stretch. Resizing an OBS source counts as a resize, and so does
  // going fullscreen, which is the whole reason the editor watches for it.
  resize();
  refit();
  onResize();
});

addEventListener('error', (e) => fail(`Script error:\n${e.message}`));

let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = (now - last) / 1000; last = now;
  const step = THREE.MathUtils.degToRad(SPIN) * dt;
  for (const p of pivots) p.rotation.y += step;

  if (PLATEMODE) {
    // Both cameras here are driven straight from numbers, so there is nothing
    // to integrate each frame. OrbitControls stays out of it entirely: a camera
    // that can tumble is the wrong tool for judging a shot that cannot.
  } else if (DRAG) {
    controls.update();
  } else if (PARALLAX && framed) {
    // Exponential smoothing keyed off elapsed time, so the lean feels the same
    // whether the page is running at 60fps or dropping frames under stream load.
    const k = 1 - Math.exp(-EASE * dt);
    haveX += (wantX - haveX) * k;
    haveY += (wantY - haveY) * k;
    placeCamera();
  } else if (SWAYING && framed) {
    // Two sine waves at different rates, so the camera traces a slow figure
    // eight and never visibly repeats a straight back-and-forth. The vertical
    // one runs slower and shallower because height reads stronger on screen.
    swayT += dt;
    const w = swayT * SWAYHZ * Math.PI * 2;
    haveX = Math.sin(w);
    haveY = Math.sin(w * 0.5) * 0.6;
    placeCamera();
  }

  if (bgScene) {
    // Plate first, models over it, one clear between them so the plate is not
    // wiped by the second pass.
    renderer.autoClear = false;
    renderer.clear();
    renderer.render(bgScene, bgCam);
    renderer.render(scene, camera);
    renderer.autoClear = true;
  } else {
    renderer.render(scene, camera);
  }
});

boot();
</script>
</body>
</html>
