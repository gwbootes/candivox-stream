<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Candivox Model Stage</title>
<style>
  /* OBS composites this page over the scene below it, so nothing here may
     paint an opaque background — not html, not body, not the canvas. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; background: transparent; }

  /* The pointer is hidden by default so a fullscreen browser window reads as
     a clean plate. Adding drag=1 puts it back, because posing a model by hand
     is impossible without seeing where you are grabbing. */
  html.hide-cursor, html.hide-cursor * { cursor: none; }

  /* Only ever visible while something is wrong. A silent black rectangle in
     OBS is indistinguishable from a broken source, so failures must speak. */
  #err {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    font: 14px/1.5 ui-monospace, Consolas, monospace;
    color: #ffd7d7; background: rgba(40, 0, 0, .82);
    padding: 2rem; text-align: center; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader }     from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader }     from 'three/addons/loaders/MTLLoader.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';

// ---------------------------------------------------------------------------
// One page serves every asset. Everything is driven off the query string.
//
//   ONE MODEL      index.html?model=models/television.obj
//   THE WHOLE SET  index.html?gallery=1
//   A CHOSEN FEW   index.html?models=models/tv.obj,models/gacha.obj
//
//   spin   auto-rotation in degrees per second (0 to hold still)
//   yaw    starting turn, degrees
//   pitch  camera height angle, degrees above the middle
//   zoom   distance multiplier; 1 frames things snugly
//   gap    space between models in a row, as a fraction of their width
//   even   1 rescales every model to the same height
//   drag   1 allows mouse orbit (needs OBS "Interact")
//   debug  1 paints a dark backdrop and a grid so you can see the stage
//
//   parallax  degrees the camera leans toward the pointer (0 disables)
//   follow    1 takes the steer from stage.py; the only way this works in OBS
//   sway      degrees of automatic lean, driven by a clock; needs no input
//   ease      how fast the lean catches up; lower is floatier
// ---------------------------------------------------------------------------
const q     = new URLSearchParams(location.search);
const num   = (k, d) => { const v = parseFloat(q.get(k)); return Number.isFinite(v) ? v : d; };
const SPIN  = num('spin', 12);
const YAW   = num('yaw', 0);
const PITCH = num('pitch', 14);
const ZOOM  = num('zoom', 1);
const GAP   = num('gap', 0.25);
const EVEN  = q.get('even') === '1';
const DRAG  = q.get('drag') === '1';
const DEBUG = q.get('debug') === '1';
// follow=1 takes the lean from stage.py instead of from mouse events, which is
// the only way it can work inside OBS. Turning it on implies wanting a lean, so
// it brings a sensible parallax along with it.
const FOLLOW = q.get('follow') === '1';
const PARA  = num('parallax', FOLLOW ? 25 : 0);
const EASE  = num('ease', 4);
const FOV   = num('fov', 35);

const SWAY   = num('sway', 0);
const SWAYHZ = num('swayspeed', 0.09);

// Hand orbiting and pointer-lean both want the mouse, so drag wins outright.
const PARALLAX = PARA > 0 && !DRAG;
// An OBS Browser source never receives mouse movement, so sway drives the same
// camera lean off a clock instead. It only takes over when nothing else wants
// the camera.
const SWAYING  = SWAY > 0 && !DRAG && !PARALLAX;
// Whichever mode is live owns the swing, measured in degrees either way.
const SWING    = PARALLAX ? PARA : (SWAYING ? SWAY : 0);

if (!DRAG) document.documentElement.classList.add('hide-cursor');

// ---------------------------------------------------------------------------
// PLATE CALIBRATION - bedroom-desk-v1.png, 1920x1080
//
// Solved from the plate itself rather than guessed. Both edges of the desk top
// were measured to sub-pixel precision across 47 columns and fitted:
//
//   far edge   y = 0.000625x + 822.558   (rms 0.085 px)
//   near edge  y = 0.005344x + 1031.808  (rms 0.070 px)
//
// They are straight, and they are NOT parallel, so they meet at a vanishing
// point. That puts the horizon at y = 794.84, which is BELOW the middle of the
// frame, meaning the plate's camera is tilted UP rather than down. Everything
// below follows from that plus the desk model being 10.0 units deep.
//
// The fov is an assumption. Change it and camY/nearZ change with it, but the
// projection stays identical, so the grid still lands on the same pixels.
// ---------------------------------------------------------------------------
const PLATE = {
  fov:      35,        // vertical, degrees
  pitch:    8.4635,    // degrees, positive tilts the camera UP
  camY:     0.1825,    // camera height above the desk top, obj units
  nearZ:    1.3743,    // ground distance from camera to the desk's front edge
  depth:    10.0,      // desk front-to-back, from the desk .obj bounding box
  width:    25.6,      // desk left-to-right, same source
  image:   'plates/bedroom-desk-v1.png',
};

const PLATEMODE = q.get('plate') === '1';
const GRID      = q.get('grid') === '1';
const SHOWBG    = q.get('bg') === '1';
const CELL      = num('cell', 1);          // grid square size in obj units
const HORIZON   = num('horizon', 0);       // nudge, in degrees of pitch

const fail = (msg) => {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'flex';
};

const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 100000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);   // the 0 alpha is what OBS keys on
document.body.appendChild(renderer.domElement);

if (DEBUG) {
  renderer.setClearColor(0x141018, 1);
  scene.add(new THREE.GridHelper(400, 40, 0x00ffc8, 0x334455));
}

// Voxel work reads best with flat, even light: one soft sky/ground wash so no
// face goes black, plus two directionals at opposing angles to keep the cube
// edges legible. Strong single-key lighting turns voxel art into mush.
scene.add(new THREE.HemisphereLight(0xffffff, 0x404058, 2.0));
const key  = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(1, 2, 1.5);
const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(-1.5, 0.6, -1);
scene.add(key, fill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enabled = DRAG;

// Sit the camera exactly where the plate's camera was. Ground plane y=0 is the
// desk top, and the desk runs from z=-nearZ at the front to z=-(nearZ+depth)
// at the back. Anything dropped on y=0 between those lands on the table.
function usePlateCamera() {
  if (!q.get('fov')) camera.fov = PLATE.fov;
  const pitch = THREE.MathUtils.degToRad(PLATE.pitch + HORIZON);

  let camY = num('camy', PLATE.camY);
  if (q.get('flush') === '1') {
    // Raise the camera until the desk's front edge lands exactly on the bottom
    // of the frame, which hides the lip below it. Solved rather than nudged, so
    // it stays exact at any resolution: the bottom of frame is where the ray at
    // half the vertical fov meets the plane.
    const T = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
    camY = PLATE.nearZ * (T * Math.cos(pitch) - Math.sin(pitch))
                       / (Math.cos(pitch) + T * Math.sin(pitch));
  }

  camera.position.set(0, camY, 0);
  camera.rotation.set(pitch, 0, 0);
  camera.near = 0.01;
  camera.far  = 10000;
  camera.updateProjectionMatrix();
  controls.enabled = false;   // orbiting would throw away the match
}

// Grid drawn on the desk top itself, clipped to the desk's real footprint, so
// the lines stop where the wood stops instead of floating past the back edge.
function buildGrid() {
  const zFront = -PLATE.nearZ;
  const zBack  = -(PLATE.nearZ + PLATE.depth);
  const halfW  = PLATE.width / 2;
  const pts    = [];

  // Lines running left to right, stepping back in depth.
  for (let z = zFront; z >= zBack - 1e-6; z -= CELL) {
    pts.push(-halfW, 0, z, halfW, 0, z);
  }
  // Lines running front to back. These are the ones that show the perspective.
  for (let x = -halfW; x <= halfW + 1e-6; x += CELL) {
    pts.push(x, 0, zFront, x, 0, zBack);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const grid = new THREE.LineSegments(
    geo,
    new THREE.LineBasicMaterial({ color: 0x00ffc8, transparent: true, opacity: 0.55 })
  );
  scene.add(grid);

  // The desk's own outline, brighter, so the front and back edges are obvious
  // when checking the match against the plate.
  const edge = new THREE.BufferGeometry();
  edge.setAttribute('position', new THREE.Float32BufferAttribute([
    -halfW, 0, zFront,  halfW, 0, zFront,
    -halfW, 0, zBack,   halfW, 0, zBack,
  ], 3));
  scene.add(new THREE.LineSegments(
    edge, new THREE.LineBasicMaterial({ color: 0xff3ea5 })
  ));
}

// The plate itself, behind everything, for checking the grid lands on the wood.
// Drawn as a second scene so no camera move or fov change can shift it.
let bgScene = null, bgCam = null;
function showPlate() {
  bgCam   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  bgScene = new THREE.Scene();
  new THREE.TextureLoader().load(PLATE.image, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    bgScene.add(new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.MeshBasicMaterial({ map: tex, depthTest: false, depthWrite: false })
    ));
  });
}

const pivots = [];   // one per model; each spins about its own middle

// Where layout() parked the camera. Pointer-lean orbits around these instead
// of nudging the camera in place, so nearer models swing further across the
// frame than distant ones and the row gains real depth.
let baseDist = 0, basePitch = 0, framed = false;
let fitW = 0, fitH = 0;   // world-space extents the camera has to cover

// Pointer position as -1..1 from the middle of the window. `want` is where the
// camera is being asked to look; `have` chases it, which is what turns a jumpy
// cursor into a slow lean. Declared up here so placeCamera() can read them.
let wantX = 0, wantY = 0, haveX = 0, haveY = 0;
let swayT = 0;   // seconds elapsed, drives the automatic lean

// Breathing room around the framed set. Kept tight because every percent of
// padding is a percent the models shrink by.
const PAD = 1.08;

// MagicaVoxel writes its palette as a tiny image — often a single row of
// colour swatches. Three's default linear filtering blends neighbouring
// swatches, so every voxel comes out smeared with the wrong colour. Nearest
// sampling is mandatory here, not a stylistic choice.
function crispenTextures(root) {
  root.traverse((child) => {
    if (!child.isMesh) return;
    for (const mat of [].concat(child.material)) {
      if (!mat || !mat.map) continue;
      mat.map.magFilter  = THREE.NearestFilter;
      mat.map.minFilter  = THREE.NearestFilter;
      mat.map.generateMipmaps = false;
      mat.map.colorSpace = THREE.SRGBColorSpace;
      mat.map.needsUpdate = true;
    }
  });
}

// Filenames here contain spaces and capitals ("2-stereo rack.obj"), so every
// path segment has to be encoded or the fetch 404s while the folder looks fine.
const encodePath = (p) => p.split('/').map(encodeURIComponent).join('/');

function loadOne(path) {
  const ext  = path.split('.').pop().toLowerCase();
  const dir  = path.includes('/') ? path.slice(0, path.lastIndexOf('/') + 1) : '';
  const file = path.slice(dir.length);

  return new Promise((resolve, reject) => {
    if (ext === 'glb' || ext === 'gltf') {
      new GLTFLoader().load(encodePath(path), (g) => resolve(g.scene), undefined, reject);
      return;
    }
    if (ext !== 'obj') { reject(new Error(`Unsupported format ".${ext}"`)); return; }

    // MagicaVoxel emits three files together: model.obj, model.mtl and the
    // palette .png, all sharing a name. A missing .mtl is survivable — the
    // mesh loads grey — so fall back to a bare OBJ rather than failing.
    const objLoader = new OBJLoader();
    const bare = () => objLoader.setPath(encodePath(dir))
      .load(encodeURIComponent(file), resolve, undefined, reject);

    new MTLLoader()
      .setPath(encodePath(dir))
      .setResourcePath(encodePath(dir))
      .load(
        encodeURIComponent(file.replace(/\.obj$/i, '.mtl')),
        (materials) => {
          materials.preload();
          objLoader.setMaterials(materials).setPath(encodePath(dir))
            .load(encodeURIComponent(file), resolve, undefined, reject);
        },
        undefined,
        bare
      );
  });
}

// Models arrive at wildly different voxel scales and none of them sit on the
// origin, so every one gets measured and re-centred rather than hand-placed.
function prepare(object) {
  crispenTextures(object);
  const box    = new THREE.Box3().setFromObject(object);
  const size   = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  object.position.sub(centre);

  const pivot = new THREE.Group();
  pivot.add(object);
  pivot.rotation.y = THREE.MathUtils.degToRad(YAW);
  return { pivot, size };
}

// Lay the set out in a single row along X. Each model keeps its own pivot so
// it turns about its own middle instead of orbiting the row's centre.
function layout(entries) {
  if (!entries.length) { fail('Nothing loaded.'); return; }

  if (EVEN) {
    const tallest = Math.max(...entries.map(e => e.size.y));
    for (const e of entries) {
      const s = tallest / (e.size.y || 1);
      e.pivot.scale.setScalar(s);
      e.size = e.size.clone().multiplyScalar(s);
    }
  }

  // A rotating model sweeps a circle, so reserve its diagonal footprint or
  // neighbours clip through each other as they turn.
  const widths = entries.map(e => Math.hypot(e.size.x, e.size.z));
  const total  = widths.reduce((a, w) => a + w, 0) + GAP * widths[0] * (entries.length - 1);

  let x = -total / 2;
  for (let i = 0; i < entries.length; i++) {
    x += widths[i] / 2;
    entries[i].pivot.position.x = x;
    x += widths[i] / 2 + GAP * widths[0];
    scene.add(entries[i].pivot);
    pivots.push(entries[i].pivot);
  }

  // Plate mode has a camera it must not move, so the models come to the camera
  // instead. They get stood on the desk surface rather than centred on it.
  if (PLATEMODE) {
    for (const e of entries) {
      e.pivot.position.y = e.size.y / 2;
      e.pivot.position.z = -(PLATE.nearZ + PLATE.depth / 2);
    }
    return;
  }

  fitW      = total || 1;
  fitH      = Math.max(...entries.map(e => e.size.y)) || 1;
  basePitch = THREE.MathUtils.degToRad(PITCH);
  framed    = true;
  refit();

  controls.target.set(0, 0, 0);
  controls.update();
}

// Three's `fov` is the VERTICAL angle. A row of models is a horizontal span, so
// measuring it against the vertical angle pulls the camera back by roughly the
// aspect ratio further than needed and the models come out tiny on a widescreen
// canvas. Width is checked against the horizontal angle, height against the
// vertical one, and whichever needs more room decides the distance.
function refit() {
  if (!framed) return;
  const halfV = THREE.MathUtils.degToRad(camera.fov) / 2;
  const halfH = Math.atan(Math.tan(halfV) * camera.aspect);

  baseDist = Math.max(
    (fitW / 2) / Math.tan(halfH),
    (fitH / 2) / Math.tan(halfV)
  ) * PAD * ZOOM;

  camera.near = Math.max(baseDist / 1000, 0.01);
  camera.far  = baseDist * 100;
  camera.updateProjectionMatrix();
  placeCamera();
}

// Position the camera on its orbit, offset by however far the pointer-lean has
// currently travelled. Called on every frame that parallax is running, and once
// per reframe so a resize lands the camera in the right place immediately.
function placeCamera() {
  const swing = THREE.MathUtils.degToRad(SWING);
  const yaw   = haveX * swing;
  // Vertical travel is damped and clamped: swinging the camera under the floor
  // or straight overhead looks broken rather than responsive.
  const pitch = THREE.MathUtils.clamp(
    basePitch - haveY * swing * 0.6,
    THREE.MathUtils.degToRad(-25),
    THREE.MathUtils.degToRad(75)
  );

  camera.position.set(
    Math.sin(yaw) * Math.cos(pitch) * baseDist,
    Math.sin(pitch) * baseDist,
    Math.cos(yaw) * Math.cos(pitch) * baseDist
  );
  camera.lookAt(0, 0, 0);
}

async function boot() {
  let paths = [];

  if (PLATEMODE) {
    usePlateCamera();
    if (SHOWBG) showPlate();
    if (GRID)   buildGrid();
  }

  if (q.get('gallery') === '1') {
    // A browser cannot list a folder, so the set is declared in manifest.json.
    // Re-run make-manifest.bat after exporting new models.
    try {
      const res  = await fetch('models/manifest.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      paths = data.models.map(n => 'models/' + n);
    } catch (e) {
      fail(`Could not read models/manifest.json\n${e.message}\n\nRun make-manifest.bat, then reload.`);
      return;
    }
  } else if (q.get('models')) {
    paths = q.get('models').split(',').map(s => s.trim()).filter(Boolean);
  } else if (q.get('model')) {
    paths = [q.get('model')];
  } else if (PLATEMODE) {
    // Checking the grid against the plate is a legitimate reason to load
    // nothing at all, so this is not an error.
    return;
  } else {
    fail('No model given.\n\nOne model:  ?model=models/yourfile.obj\nAll of them: ?gallery=1');
    return;
  }

  const results = await Promise.allSettled(paths.map(loadOne));
  const good = [], bad = [];
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') good.push(prepare(r.value));
    else bad.push(`${paths[i]} — ${r.reason?.message || r.reason}`);
  });

  if (!good.length) { fail(`Nothing loaded.\n\n${bad.join('\n')}`); return; }
  layout(good);
  if (bad.length) console.warn('[candivox] models that failed to load:\n' + bad.join('\n'));
}

if (PARALLAX && FOLLOW) {
  // Asking beats waiting. OBS never delivers a mouse event to this page, so
  // the steer gets pulled from stage.py on a timer instead. Whatever stage.py
  // reports drives the lean, which is how Silhouette will steer it later
  // without this file changing at all.
  const POLL = q.get('followurl') || '/position';
  const tick = async () => {
    try {
      const res = await fetch(POLL, { cache: 'no-store' });
      if (res.ok) {
        const d = await res.json();
        if (Number.isFinite(d.x)) wantX = d.x;
        if (Number.isFinite(d.y)) wantY = d.y;
      }
    } catch (e) {
      // Bridge is down or restarting. Hold the last steer and keep asking;
      // snapping to centre on every hiccup would read as a glitch on stream.
    }
    setTimeout(tick, 33);
  };
  tick();
} else if (PARALLAX) {
  addEventListener('pointermove', (e) => {
    wantX = (e.clientX / innerWidth)  * 2 - 1;
    wantY = (e.clientY / innerHeight) * 2 - 1;
  });
  // Drift back to centre when the pointer leaves, so the scene never parks
  // at a hard angle just because the mouse went to another monitor.
  addEventListener('pointerleave', () => { wantX = 0; wantY = 0; });
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  // The framing depends on aspect now, so a resize has to re-measure rather
  // than just stretch. Resizing an OBS source counts as a resize.
  camera.updateProjectionMatrix();
  refit();
});

addEventListener('error', (e) => fail(`Script error:\n${e.message}`));

let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = (now - last) / 1000; last = now;
  const step = THREE.MathUtils.degToRad(SPIN) * dt;
  for (const p of pivots) p.rotation.y += step;

  if (PLATEMODE) {
    // The camera is calibrated to the plate. Nothing gets to move it.
  } else if (DRAG) {
    controls.update();
  } else if (PARALLAX && framed) {
    // Exponential smoothing keyed off elapsed time, so the lean feels the same
    // whether the page is running at 60fps or dropping frames under stream load.
    const k = 1 - Math.exp(-EASE * dt);
    haveX += (wantX - haveX) * k;
    haveY += (wantY - haveY) * k;
    placeCamera();
  } else if (SWAYING && framed) {
    // Two sine waves at different rates, so the camera traces a slow figure
    // eight and never visibly repeats a straight back-and-forth. The vertical
    // one runs slower and shallower because height reads stronger on screen.
    swayT += dt;
    const w = swayT * SWAYHZ * Math.PI * 2;
    haveX = Math.sin(w);
    haveY = Math.sin(w * 0.5) * 0.6;
    placeCamera();
  }

  if (bgScene) {
    // Plate first, models over it, one clear between them so the plate is not
    // wiped by the second pass.
    renderer.autoClear = false;
    renderer.clear();
    renderer.render(bgScene, bgCam);
    renderer.render(scene, camera);
    renderer.autoClear = true;
  } else {
    renderer.render(scene, camera);
  }
});

boot();
</script>
</body>
</html>
